; ============================================
; Sistema de Riego Autónomo - ESP32
; Plataforma: espressif32 | Framework: Arduino
; ============================================

[platformio]
default_envs = dev

; ============================================
; ENTORNO BASE
; ============================================
[env]
platform = espressif32
board = esp32dev
framework = arduino

upload_speed = 115200
monitor_speed = 115200

monitor_filters =
    time
    esp32_exception_decoder
    log2file

board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D MODO_SIMULACION=0
    -D DEBUG_MODE=1

[env:dev]
extends = env

[env:simulacion]
extends = env
build_flags =
    ${env.build_flags}
    -D MODO_SIMULACION=1 

[env:prod]
extends = env
build_flags =
    ${env.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D DEBUG_MODE=0