; ============================================
; Sistema de Riego Autónomo - ESP32
; Plataforma: Espressif32 | Framework: Arduino
; ============================================

[platformio]
default_envs = dev

; ============================================
; ENTORNO BASE (común a todos)
; ============================================
[env]
platform = espressif32
board = esp32dev
framework = arduino

upload_speed = 460800
monitor_speed = 115200

monitor_filters =
    time
    esp32_exception_decoder
    log2file

board_build.partitions = min_spiffs.csv

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=3

; ============================================
; ENTORNO DEV (desarrollo, logs activos)
; ============================================
[env:dev]
build_flags =
    ${env.build_flags}
    -D MODO_SIMULACION=0
    -D MODO_PRUEBA_VALVULA=0
    -D DEBUG_MODE=1

; ============================================
; ENTORNO SIMULACIÓN (sin hardware conectado)
; ============================================
[env:simulacion]
build_flags =
    ${env.build_flags}
    -D MODO_SIMULACION=1
    -D MODO_PRUEBA_VALVULA=0
    -D DEBUG_MODE=1

; ============================================
; ENTORNO PRUEBA VÁLVULA (test visual con LED)
; ============================================
[env:prueba_valvula]
build_flags =
    ${env.build_flags}
    -D MODO_SIMULACION=0
    -D MODO_PRUEBA_VALVULA=1
    -D DEBUG_MODE=1

; ============================================
; ENTORNO PRODUCCIÓN (desplegado en campo)
; ============================================
[env:prod]
build_flags =
    ${env.build_flags}
    -D MODO_SIMULACION=0
    -D MODO_PRUEBA_VALVULA=0
    -D DEBUG_MODE=0
    -D CORE_DEBUG_LEVEL=0